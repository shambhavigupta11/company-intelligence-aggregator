name: Deploy dashboard

# Builds the React dashboard and publishes it to GitHub Pages on every push to
# main. The Pages site is static: point it at a hosted API by setting the
# VITE_API_BASE repository variable (otherwise /api calls have no backend).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for the same ref.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - name: Build
        env:
          # Project Pages serve under /<repo>/, so assets need that base path.
          VITE_BASE: "/${{ github.event.repository.name }}/"
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
