[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "company-intelligence-aggregator"
version = "0.1.0"
description = "Real-time + batch data acquisition platform for company intelligence signals."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Shambhavi Gupta", email = "shambhaviaug11gupta@gmail.com" }
]
keywords = ["data-engineering", "etl", "streaming", "spark", "kafka", "company-intelligence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "requests>=2.31",
  "pydantic>=2.5",
  "python-dotenv>=1.0",
  "click>=8.1",
  "beautifulsoup4>=4.12",
  "playwright>=1.40",
  "kafka-python>=2.0",
  "pyspark>=3.5",
  "delta-spark>=3.0",
  "google-cloud-bigquery>=3.13",
  "psycopg2-binary>=2.9",
  "flask>=3.0",
  "flask-cors>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.1",
  "mypy>=1.7",
]

[project.scripts]
company-intel = "company_intel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/company_intel"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
